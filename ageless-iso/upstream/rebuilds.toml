# Packages Ageless Linux rebuilds for its archive (see docs/mate-and-mint.md).
# Built by tools/rebuild.py inside the build container.
#
#   kind = "git"       clone url at ref (optionally pinned to `commit`), then
#                      dpkg-buildpackage (upstream ships debian/)
#   kind = "backport"  apt-get source from `from_suite`, rebuild for trixie with
#                      a ~ageless version suffix so Debian's next release wins
#
# `enabled = false` entries are planned but not yet validated.

[[package]]
name = "mint-x-icons"
kind = "git"
url = "https://github.com/linuxmint/mint-x-icons.git"
ref = "1.7.9"
why = "runtime dependency of mint-themes; not in Debian"

[[package]]
name = "mint-themes"
kind = "git"
url = "https://github.com/linuxmint/mint-themes.git"
ref = "2.4.2"
why = "Mint-Y GTK theme; Debian ships only mint-y-icons"

[[package]]
name = "mintmenu"
kind = "git"
url = "https://github.com/linuxmint/mintmenu.git"
# Mint stopped tagging mintmenu at 5.9.0 (Python 2). 6.2.3 lives on master;
# pin the commit so builds are repeatable.
ref = "master"
commit = "b0ff4eb20c1e670d93a966e3d80d4374f25f0a1b"
why = "Mint's MATE menu; replaces mate-menu in the ageless panel layout"

[[package]]
name = "slick-greeter"
kind = "backport"
from_suite = "forky"
why = "2.2.x greeter (trixie has 2.0.9)"
enabled = false

[[package]]
name = "mate-desktop"
kind = "backport"
from_suite = "forky"
why = "first step of the MATE 1.28 stack"
enabled = false
