# Ageless Linux ISO pipeline.
#   push / PR touching ageless-iso/  -> lint, build .debs, build + smoke-test ISOs
#   tag v*                           -> release gate (tools/release.py check), then the same,
#                                       pinned to the snapshot, release versions, plus a draft
#                                       GitHub Release
#   push to main                     -> also publishes the signed apt archive to GitHub
#                                       Pages, once enabled (docs/upgrades.md)
#   workflow_dispatch                -> manual run, optionally flagrant / pinned
name: ageless-iso

on:
  push:
    branches: [main, "claude/**"]
    paths: ["ageless-iso/**", ".github/workflows/ageless-iso.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["ageless-iso/**", ".github/workflows/ageless-iso.yml"]
  workflow_dispatch:
    inputs:
      flagrant:
        description: "Build flagrant-mode ISOs"
        type: boolean
        default: false
      pinned:
        description: "Use the snapshot.debian.org pin from common/release.env"
        type: boolean
        default: false

concurrency:
  group: ageless-iso-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ageless-iso

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # tags and history, for tools/release.py
      - name: Release gate (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tools/release.py check "$GITHUB_REF_NAME"
      - name: shellcheck
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning variant-*/build-inner.sh tools/*.sh tests/*.sh \
            packages/ageless/os-release/ageless-update-os-release \
            packages/ageless/agelessd/agelessd \
            packages/ageless/desktop/ageless-desktop-reset
      - name: python
        run: |
          python3 -m py_compile build.py tests/smoke.py tools/*.py \
            packages/ageless/sysinfo/ageless_sysinfo.py packages/ageless/sysinfo/ageless-flagrant \
            packages/ageless/sysinfo/ageless-system-info packages/ageless-device/bin/ageless-device \
            packages/mintmenu/usr/lib/linuxmint/mintMenu/apt-helper.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Build packages and the apt archive
        run: |
          args=(--variant packages --runtime docker)
          [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == true ]] && args+=(--release)
          ./build.py "${args[@]}"
      - name: Install and exercise them on a clean trixie
        run: docker run --rm -v "$PWD:/src:ro" -v "$PWD/out/repo:/repo:ro" debian:trixie bash /src/tests/package-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: ageless-iso/out/debs/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: apt-repo
          path: ageless-iso/out/repo/
          retention-days: 14

  # Signed apt archive on GitHub Pages: what installed systems upgrade from.
  # Off until the repository variable AGELESS_APT_PUBLISH is "true" and the
  # AGELESS_ARCHIVE_SIGNING_KEY secret exists (docs/upgrades.md).
  apt-archive:
    if: vars.AGELESS_APT_PUBLISH == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [lint, packages]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apt-repo, path: ageless-iso/out/repo }
      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.AGELESS_ARCHIVE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::AGELESS_ARCHIVE_SIGNING_KEY is not set; see docs/upgrades.md"; exit 1
          fi
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          fpr=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')
          python3 tools/make-repo.py sign out/repo --key "$fpr"
          gpg --batch --armor --export "$fpr" > out/repo/ageless-archive-keyring.asc
          printf '<!doctype html><title>Ageless Linux apt archive</title><p>This is an apt archive. See <a href="https://github.com/agelesslinux/agelesslinux/blob/main/ageless-iso/docs/upgrades.md">docs/upgrades.md</a>.</p>\n' > out/repo/index.html
          touch out/repo/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: ageless-iso/out/repo }
      - id: deploy
        uses: actions/deploy-pages@v4

  iso:
    needs: [lint, packages]
    strategy:
      fail-fast: false
      matrix:
        variant: [live, netinst]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # arm64 is new territory (Debian ships no arm64 live images); keep it
    # visible without letting it block amd64.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup || true
          df -h /
      - name: Enable KVM for the smoke test
        working-directory: /
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
      - name: Build ISO
        run: |
          args=(--variant ${{ matrix.variant }} --arch ${{ matrix.arch }} --runtime docker)
          if [[ "${{ startsWith(github.ref, 'refs/tags/v') || inputs.pinned }}" != true ]]; then
            args+=(--snapshot none)   # day-to-day builds track deb.debian.org; releases use the pin
          fi
          [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == true ]] && args+=(--release)
          [[ "${{ inputs.flagrant }}" == true ]] && args+=(--flagrant)
          ./build.py "${args[@]}"
          ls -lh out/
      - name: Check release-asset size limit (2 GiB)
        run: |
          for iso in out/*.iso; do
            size=$(stat -c %s "$iso")
            echo "$iso: $((size / 1048576)) MiB"
            [ "$size" -lt 2147483648 ] || { echo "::error::$iso exceeds GitHub's 2 GiB release asset limit"; exit 1; }
          done
      - name: Smoke test in QEMU
        run: |
          iso=$(ls out/*.iso | head -n1)
          kvm=(); [ -e /dev/kvm ] && kvm=(--device /dev/kvm)
          docker run --rm "${kvm[@]}" -v "$PWD:/src:ro" -v "$PWD/out:/out" localhost/ageless-build:trixie \
            python3 /src/tests/smoke.py "/out/$(basename "$iso")" --arch ${{ matrix.arch }} \
              --timeout 900 --artifacts /out/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso-${{ matrix.variant }}-${{ matrix.arch }}
          path: |
            ageless-iso/out/*.iso
            ageless-iso/out/*.sha256
            ageless-iso/out/*.packages
            ageless-iso/out/*.build.log
            ageless-iso/out/smoke/
          retention-days: 7
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [iso]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: "iso-*", merge-multiple: true }
      - name: Checksums
        working-directory: dist
        run: sha256sum *.iso > SHA256SUMS && sha512sum *.iso > SHA512SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.iso
            dist/SHA256SUMS
            dist/SHA512SUMS
            dist/*.packages
